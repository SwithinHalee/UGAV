[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugav"
version = "0.1.0"
description = "Universal Game Asset Vault & Translator (UGAV) - Cross-engine offline game asset scanner, unpacker, CAS vault, and API-ready SQLite database."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "pillow>=10.0",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "pefile>=2023.2",
    "charset-normalizer>=3.0",
    "psutil>=5.9",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ugav = "ugav.app:main"

[tool.setuptools.packages.find]
include = ["ugav*"]

[tool.setuptools.package-data]
ugav = ["db/schema.sql", "gui/static/*"]
